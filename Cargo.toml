[package]
name = "fastsim"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bincode = "1.3"
blst = "0.3"
bytes = "1"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
debug = false
